<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="100" fill="#0A0A0F"/>
  <!-- Candlestick chart -->
  <!-- Candle 1 (red) -->
  <line x1="100" y1="180" x2="100" y2="360" stroke="#EF4444" stroke-width="8" stroke-linecap="round"/>
  <rect x="76" y="220" width="48" height="100" rx="6" fill="#EF4444"/>
  <!-- Candle 2 (green) -->
  <line x1="190" y1="140" x2="190" y2="340" stroke="#22C55E" stroke-width="8" stroke-linecap="round"/>
  <rect x="166" y="160" width="48" height="120" rx="6" fill="#22C55E"/>
  <!-- Candle 3 (green) -->
  <line x1="280" y1="120" x2="280" y2="300" stroke="#22C55E" stroke-width="8" stroke-linecap="round"/>
  <rect x="256" y="140" width="48" height="100" rx="6" fill="#22C55E"/>
  <!-- Candle 4 (green big) -->
  <line x1="370" y1="80" x2="370" y2="260" stroke="#22C55E" stroke-width="8" stroke-linecap="round"/>
  <rect x="346" y="100" width="48" height="120" rx="6" fill="#22C55E"/>
  <!-- Trend arrow -->
  <polyline points="90,320 190,240 290,200 390,140" stroke="#3B82F6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6"/>
</svg>
